name: Aktualizace veřejného přehledu akcí
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/scrape.yml"
permissions:
  contents: write
jobs:
  update-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/scrape_events.py
      - name: Generate unique event images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/generate_event_images.py
      - name: Commit updated feed and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json assets/event-images/
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizovat akce a jejich obrázky"
            git pull --rebase origin main
            git push
          else
            echo "Feed ani obrázky se nezměnily."
          fi
